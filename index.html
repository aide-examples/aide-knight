<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knight's Tour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="title"></h1>
  <div id="controls">
    <label>W <input id="w-input" type="number" min="1" value="8"></label>
    <label>H <input id="h-input" type="number" min="1" value="8"></label>
    <label>
      <span id="lbl-time-budget" data-i18n="timeBudgetLabel"></span>
      <input id="time-budget-input" type="number" min="1" value="10">
    </label>
    <label>
      <span id="lbl-lang" data-i18n="langLabel"></span>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
  </div>
  <div id="controls2">
    <label>
      <span id="lbl-heuristic" data-i18n="heuristicLabel"></span>
      <select id="heuristic-select">
        <option value="warnsdorff" data-i18n="heur_warnsdorff">Warnsdorff</option>
        <option value="outsideIn"  data-i18n="heur_outsideIn">Outside-In</option>
        <option value="bruteForce" data-i18n="heur_bruteForce">Brute Force</option>
      </select>
    </label>
    <label>
      <span id="lbl-figure" data-i18n="figureLabel"></span>
      <select id="figure-select">
        <option value="1,2" data-i18n="fig_1_2">(1, 2)</option>
        <option value="1,4" data-i18n="fig_1_4">(1, 4)</option>
        <option value="2,3" data-i18n="fig_2_3">(2, 3)</option>
        <option value="3,4" data-i18n="fig_3_4">(3, 4)</option>
      </select>
    </label>
    <button id="mix-btn" type="button" data-i18n="mixBtn"></button>
  </div>
  <div id="controls3">
    <label><input type="checkbox" id="show-numbers" checked> <span id="lbl-numbers" data-i18n="numbersLabel"></span></label>
    <label><input type="checkbox" id="show-lines"   checked> <span id="lbl-lines"   data-i18n="linesLabel"></span></label>
    <label><input type="checkbox" id="want-closed">          <span id="lbl-closed"  data-i18n="closedLabel"></span></label>
    <label>
      <span id="lbl-symmetry" data-i18n="symmetryLabel"></span>
      <select id="symmetry-select">
        <option value="none"  data-i18n="sym_none">—</option>
        <option value="axisV" data-i18n="sym_axisV">Axis-V</option>
        <option value="point" data-i18n="sym_point">Point</option>
        <option value="rot90" data-i18n="sym_rot90">Rot-90°</option>
      </select>
    </label>
  </div>
  <div id="board"></div>
  <div id="search-controls">
    <button id="stop-btn"        type="button" data-i18n="stopBtn"        hidden></button>
    <button id="sensitivity-btn" type="button" data-i18n="sensitivityBtn" hidden></button>
  </div>
  <div id="status"  aria-live="polite" aria-atomic="true"></div>
  <div id="status2" aria-live="polite" aria-atomic="true"></div>
  <script src="js/i18n.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/sym.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/state.js"></script>
  <script src="js/board.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/driver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
